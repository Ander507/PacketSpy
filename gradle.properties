# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G

# Fabric toolchain, shared by every target
loom_version=1.18.2
loader_version=0.19.5

# Mod Properties
mod_version=2.4
maven_group=org.ander507
archives_base_name=PacketSpy

# Dependencies
java_websocket_version=1.6.0

# Which jar a plain `gradlew build` (and the IDE) uses. Targets are listed in versions.json.
# Build every jar with build_release.bat.
target=1.21-1.21.8
